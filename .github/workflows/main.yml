name: Build Exynos7885 KSU v0.9.5 (GCC)
on:
  workflow_dispatch:
  push:
    branches: [ R24U ]

env:
  KSU_TAG: "v0.9.5"
  LOCALVERSION: "-Haubai"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        defconfig:
          - exynos7885-a10_defconfig
          - exynos7885-a20_defconfig
          - exynos7885-a30_defconfig
          - exynos7885-a30s_defconfig
          - exynos7885-a40_defconfig

    steps:
      # =========================================================
      # 1. CHECKOUT & DEPENDENCIES
      # =========================================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: R24U
          path: kernel
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio \
            gcc-aarch64-linux-gnu zip libelf-dev pkg-config device-tree-compiler

      # =========================================================
      # 2. KERNELSU + PATCH SOURCE
      # =========================================================
      - name: Setup KernelSU & Patch source
        working-directory: ./kernel
        run: |
          # --- Setup KernelSU ---
          git submodule update --init --recursive
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "${KSU_TAG}"

          # --- Patch LOCALVERSION (xóa TẤT CẢ dòng cũ) ---
          sed -i '/^LOCALVERSION[[:space:]]*=/d' Makefile
          sed -i '/^EXTRAVERSION[[:space:]]*=/a LOCALVERSION = -Haubai' Makefile

          for f in arch/arm64/configs/exynos7885-*defconfig; do
            sed -i '/^CONFIG_LOCALVERSION=/d' "$f"
            echo 'CONFIG_LOCALVERSION="-Haubai"' >> "$f"
          done

          # Sửa LOCALVERSION trong các script build nếu có
          grep -rln "LOCALVERSION" --include="*.sh" . 2>/dev/null | while read f; do
            sed -i 's/LOCALVERSION=-[^ "]*/LOCALVERSION=-Haubai/g' "$f" || true
          done

          echo "=== All LOCALVERSION lines in Makefile ==="
          grep -n "LOCALVERSION" Makefile || true
          echo "=== All CONFIG_LOCALVERSION lines in defconfig ==="
          grep -rn "CONFIG_LOCALVERSION" arch/arm64/configs/ || true

          # --- Patch Manual Hook (kèm extern) ---
          # fs/exec.c
          sed -i '/^#include <linux\/sched.h>/a\
          #ifdef CONFIG_KSU\
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\
          #endif' fs/exec.c
          sed -i '/^static int do_execveat_common(int fd, struct filename \*filename,/,/^{/ { /^{/a\
          #ifdef CONFIG_KSU\
          ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\
          #endif
          }' fs/exec.c

          # fs/open.c
          sed -i '/^long do_faccessat/i\
          #ifdef CONFIG_KSU\
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\
          #endif' fs/open.c
          sed -i '/^long do_faccessat/,/^{/ { /^{/a\
          #ifdef CONFIG_KSU\
          ksu_handle_faccessat(&dfd, &filename, &mode, NULL);\
          #endif
          }' fs/open.c

          # fs/read_write.c
          sed -i '/^ssize_t vfs_read/i\
          #ifdef CONFIG_KSU\
          extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\
          #endif' fs/read_write.c
          sed -i '/^ssize_t vfs_read(struct file \*file, char __user \*buf, size_t count, loff_t \*pos)/,/^{/ { /^{/a\
          #ifdef CONFIG_KSU\
          ksu_handle_vfs_read(&file, &buf, &count, &pos);\
          #endif
          }' fs/read_write.c

          # fs/stat.c
          sed -i '/^int vfs_statx/i\
          #ifdef CONFIG_KSU\
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, void **statbuf, int *flags);\
          #endif' fs/stat.c
          sed -i '/^int vfs_statx/,/^{/ { /^{/a\
          #ifdef CONFIG_KSU\
          ksu_handle_stat(&dfd, &filename, &stat, &flags);\
          #endif
          }' fs/stat.c

          echo "=== Verify patches ==="
          grep -l "ksu_handle" fs/exec.c fs/open.c fs/read_write.c fs/stat.c

      # =========================================================
      # 2b. FIX HOST SCRIPT BUILD (GCC 13/14 trên Ubuntu 24.04)
      # =========================================================
      - name: Fix host script build for new GCC
        working-directory: ./kernel
        run: |
          # Tắt -Werror toàn cục cho host programs
          sed -i 's/-Werror//g' scripts/Makefile.host 2>/dev/null || true
          sed -i 's/-Werror//g' Makefile 2>/dev/null || true
          # Thêm -Wno-error vào HOSTCFLAGS
          if ! grep -q "HOSTCFLAGS += -Wno-error" Makefile; then
            echo 'HOSTCFLAGS += -Wno-error' >> Makefile
          fi
          echo "=== HOSTCFLAGS ==="
          grep -n "HOSTCFLAGS" Makefile | head -5 || true

      # =========================================================
      # 3. ENV (GCC)
      # =========================================================
      - name: Set environment (GCC)
        run: |
          {
            echo "CC=aarch64-linux-gnu-gcc"
            echo "LD=aarch64-linux-gnu-ld"
            echo "AR=aarch64-linux-gnu-ar"
            echo "NM=aarch64-linux-gnu-nm"
            echo "OBJCOPY=aarch64-linux-gnu-objcopy"
            echo "OBJDUMP=aarch64-linux-gnu-objdump"
            echo "STRIP=aarch64-linux-gnu-strip"
            echo "CROSS_COMPILE=aarch64-linux-gnu-"
            echo "ARCH=arm64"
          } >> $GITHUB_ENV

      # =========================================================
      # 4. BUILD
      # =========================================================
      - name: Configure & Build kernel (GCC)
        working-directory: ./kernel
        run: |
          export PLATFORM_VERSION=11
          make O=out ${{ matrix.defconfig }}

          {
            echo "CONFIG_KSU=y"
            echo "# CONFIG_KPROBES is not set"
            echo 'CONFIG_LOCALVERSION="-Haubai"'
            echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y"
          } >> out/.config

          make O=out olddefconfig

          echo "=== Verify config after olddefconfig ==="
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_LOCALVERSION|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE" out/.config || true

          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=aarch64-linux-gnu-gcc \
            LD=aarch64-linux-gnu-ld \
            AR=aarch64-linux-gnu-ar \
            NM=aarch64-linux-gnu-nm \
            OBJCOPY=aarch64-linux-gnu-objcopy \
            OBJDUMP=aarch64-linux-gnu-objdump \
            STRIP=aarch64-linux-gnu-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            2>&1 | tee build.log

      # =========================================================
      # 5. PACKAGE & UPLOAD
      # =========================================================
      - name: Show kernel version & artifacts
        if: always()
        working-directory: ./kernel
        run: |
          [ -f out/include/config/kernel.release ] && echo "kernel.release: $(cat out/include/config/kernel.release)" || true
          [ -f out/arch/arm64/boot/Image ] && strings out/arch/arm64/boot/Image 2>/dev/null | grep -m1 "Haubai" || true
          echo "=== Boot artifacts ==="
          ls -la out/arch/arm64/boot/ || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.defconfig }}
          path: kernel/build.log
          if-no-files-found: warn

      - name: Package flashable zip
        if: success()
        run: |
          cp -r kernel/kernel_zip/anykernel ak && cd ak
          if [ -f ../kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .
            echo "Using Image.gz-dtb (DTB appended)"
          elif [ -f ../kernel/out/arch/arm64/boot/Image.gz ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz .
            echo "::warning::Image.gz-dtb not found, using Image.gz"
          else
            cp ../kernel/out/arch/arm64/boot/Image .
            echo "::warning::Image.gz-dtb not found, using Image"
          fi
          zip -r9 ../HaubaiKernel_${{ matrix.defconfig }}.zip *

      - name: Upload zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HaubaiKernel_${{ matrix.defconfig }}
          path: HaubaiKernel_${{ matrix.defconfig }}.zip
          if-no-files-found: warn
