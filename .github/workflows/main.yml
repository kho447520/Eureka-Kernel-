name: Build Exynos7885 KSU-Next (Minimal)
on:
  workflow_dispatch:
  push:
    branches:
      - R15-Next

env:
  KSU_TAG: "v1.1.1"
  LOCALVERSION: "-Haubai"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        defconfig:
          - exynos7885-a10_defconfig
          - exynos7885-a30_defconfig

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: R24U
          path: kernel
          submodules: recursive

      - name: Install GCC
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio \
            gcc-aarch64-linux-gnu zip

      - name: Setup KernelSU-Next v1.1.1
        working-directory: ./kernel
        run: |
          git submodule update --init --recursive
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_TAG}/kernel/setup.sh" | bash -s "${KSU_TAG}"

      - name: Fix KernelSU is_manager_apk
        working-directory: ./kernel
        run: |
          python3 - <<'PYEOF'
          import os, re
          p = 'KernelSU-Next/kernel/throne_tracker.c'
          if os.path.exists(p):
              s = open(p).read()
              if 'extern bool is_manager_apk' not in s:
                  includes = list(re.finditer(r'^#include .*$', s, flags=re.M))
                  if includes:
                      s = s[:includes[-1].end()] + '\n\n#ifdef CONFIG_KSU\nextern bool is_manager_apk(char *path);\n#endif\n' + s[includes[-1].end():]
                  else:
                      s = '#ifdef CONFIG_KSU\nextern bool is_manager_apk(char *path);\n#endif\n' + s
                  open(p, 'w').write(s)
          PYEOF

      - name: Configure & Build kernel (GCC)
        working-directory: ./kernel
        run: |
          rm -rf out
          export PLATFORM_VERSION=11
          make O=out ${{ matrix.defconfig }}

          {
            echo "CONFIG_KSU=y"
            echo "# CONFIG_KPROBES is not set"
            echo 'CONFIG_LOCALVERSION="-Haubai"'
          } >> out/.config

          make O=out olddefconfig

          make -j2 O=out \
            ARCH=arm64 \
            CC=aarch64-linux-gnu-gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            2>&1 | tee build.log

      - name: Package zip
        if: success()
        run: |
          cp -r kernel/kernel_zip/anykernel ak && cd ak
          if [ -f ../kernel/out/arch/arm64/boot/Image.gz-dtb ]; then cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .
          elif [ -f ../kernel/out/arch/arm64/boot/Image.gz ]; then cp ../kernel/out/arch/arm64/boot/Image.gz .
          else cp ../kernel/out/arch/arm64/boot/Image .; fi
          zip -r9 ../HaubaiKernel_${{ matrix.defconfig }}.zip *

      - name: Upload zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HaubaiKernel_${{ matrix.defconfig }}
          path: HaubaiKernel_${{ matrix.defconfig }}.zip
