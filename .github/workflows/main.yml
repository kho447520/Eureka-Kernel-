name: Build R15-OneUI + BPF merge from R24U
on:
  workflow_dispatch:
  push:
    branches: [ R15 ]

env:
  KERNEL_BRANCH: R15

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        defconfig:
          - exynos7885-a10_defconfig
          - exynos7885-a20_defconfig
          - exynos7885-a30_defconfig
          - exynos7885-a30s_defconfig
          - exynos7885-a40_defconfig

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 0

      - name: Set Git user
        working-directory: ./kernel
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Setup KernelSUNext
        working-directory: ./kernel
        run: curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v3.0.0

      - name: Verify KernelSU integration mode
        working-directory: ./kernel
        run: |
          echo "=== ksu_handle_* in KernelSU-Next/ ==="
          grep -rn "ksu_handle_faccessat" KernelSU-Next/ 2>/dev/null | head -5 || echo "Not found"
          echo "=== ksu_handle_* in fs/open.c ==="
          grep -n "ksu_handle_faccessat" fs/open.c 2>/dev/null || echo "Not in fs/open.c"
          echo "=== KSU Kconfig ==="
          grep -A3 "config KSU" KernelSU-Next/Kconfig 2>/dev/null | head -30

      - name: Clean previous build
        working-directory: ./kernel
        run: rm -rf out

      - name: Enable KernelSU in defconfig (KPROBES mode)
        working-directory: ./kernel
        run: |
          DEFCONFIG=arch/arm64/configs/${{ matrix.defconfig }}
          sed -i '/^CONFIG_KSU/d' $DEFCONFIG
          sed -i '/^# CONFIG_KSU/d' $DEFCONFIG
          sed -i '/^CONFIG_KPROBES/d' $DEFCONFIG
          sed -i '/^CONFIG_KPROBE_EVENTS/d' $DEFCONFIG
          sed -i '/^CONFIG_HAVE_KPROBES/d' $DEFCONFIG
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
          echo "CONFIG_KSU_KPROBE_HOOKS=y" >> $DEFCONFIG
          echo "=== Defconfig tail ==="
          tail -15 $DEFCONFIG

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio gcc-aarch64-linux-gnu zip

      - name: Setup Neutron Clang
        run: |
          mkdir -p toolchain
          cd toolchain
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=10032024
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          cd ..
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: Set environment
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV

      - name: Configure kernel
        working-directory: ./kernel
        run: |
          export PLATFORM_VERSION=11
          make O=out ARCH=arm64 ANDROID_MAJOR_VERSION=r ${{ matrix.defconfig }}

      - name: Build kernel
        working-directory: ./kernel
        run: |
          export PLATFORM_VERSION=11
          make -j$(nproc) O=out ARCH=arm64 ANDROID_MAJOR_VERSION=r \
            CC=${CC} LD=${LD} AR=${AR} NM=${NM} \
            OBJCOPY=${OBJCOPY} OBJDUMP=${OBJDUMP} STRIP=${STRIP} \
            CROSS_COMPILE=${CROSS_COMPILE} 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.defconfig }}
          path: kernel/build.log

      - name: Package flashable zip
        if: success()
        run: |
          cp -r kernel/kernel_zip/anykernel anykernel
          cd anykernel
          cp ../kernel/out/arch/arm64/boot/Image.gz-dtb . 2>/dev/null || \
          cp ../kernel/out/arch/arm64/boot/Image.gz . 2>/dev/null || \
          cp ../kernel/out/arch/arm64/boot/Image . 2>/dev/null || \
          { echo "ERROR: No kernel image found"; exit 1; }
          zip -r9 ../HaubaiKernel_${{ matrix.defconfig }}.zip *
          cd ..

      - name: Upload zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HaubaiKernel_${{ matrix.defconfig }}
          path: HaubaiKernel_${{ matrix.defconfig }}.zip
