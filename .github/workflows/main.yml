name: Build Exynos7885 KSU-Next v1.1.1 (Ubuntu Clang)
on:
  workflow_dispatch:
  push:
    branches: [ R24U ]

env:
  KSU_TAG: "v1.1.1"
  LOCALVERSION: "-Haubai"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        defconfig:
          - exynos7885-a10_defconfig
          - exynos7885-a20_defconfig
          - exynos7885-a30_defconfig
          - exynos7885-a30s_defconfig
          - exynos7885-a40_defconfig

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: R24U
          path: kernel
          submodules: recursive

      - name: Install build dependencies (including Ubuntu Clang)
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio \
            gcc-aarch64-linux-gnu zip libelf-dev pkg-config device-tree-compiler \
            clang lld llvm

      - name: Verify Ubuntu Clang
        run: |
          clang --version
          ld.lld --version

      - name: Setup KernelSU-Next v1.1.1
        working-directory: ./kernel
        run: |
          git submodule update --init --recursive
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_TAG}/kernel/setup.sh" | bash -s "${KSU_TAG}"

      - name: Fix KernelSU is_manager_apk declaration
        working-directory: ./kernel
        run: |
          python3 - <<'PYEOF'
          import os

          p = 'KernelSU-Next/kernel/throne_tracker.c'
          if not os.path.exists(p):
              print(f"File {p} not found, skipping")
              exit(0)

          s = open(p).read()
          if 'is_manager_apk' in s and 'extern' not in s.split('is_manager_apk')[0][-100:]:
              s = s.replace(
                  'bool is_manager = is_manager_apk(dirpath);',
                  '#ifdef CONFIG_KSU\n'
                  'extern bool is_manager_apk(char *path);\n'
                  '#endif\n'
                  '            bool is_manager = is_manager_apk(dirpath);'
              , 1)
              open(p, 'w').write(s)
              print("Patched throne_tracker.c: added extern declaration")
          else:
              print("throne_tracker.c already patched or pattern not found")
          PYEOF

      - name: Patch LOCALVERSION & Manual Hook (Python)
        working-directory: ./kernel
        run: |
          python3 - <<'PYEOF'
          import re

          # --- LOCALVERSION ---
          m = open('Makefile').read()
          m = re.sub(r'^LOCALVERSION[ \t]*=.*$', '', m, flags=re.M)
          m = re.sub(r'^(EXTRAVERSION[ \t]*=.*)$', r'\1\nLOCALVERSION = -Haubai', m, count=1, flags=re.M)
          open('Makefile', 'w').write(m)

          # --- fs/exec.c ---
          p = 'fs/exec.c'
          s = open(p).read()
          if 'ksu_handle_execveat' not in s:
              s = s.replace(
                  '#include <linux/sched.h>',
                  '#include <linux/sched.h>\n'
                  '#ifdef CONFIG_KSU\n'
                  'extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n'
                  '#endif', 1)
              s = re.sub(
                  r'(static int do_execveat_common\(int fd, struct filename \*filename,[^}]*?\{)',
                  r'\1\n#ifdef CONFIG_KSU\n    ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif',
                  s, count=1)
              open(p, 'w').write(s)

          # --- fs/open.c ---
          p = 'fs/open.c'
          s = open(p).read()
          if 'ksu_handle_faccessat' not in s:
              s = re.sub(
                  r'(^long do_faccessat\()',
                  '#ifdef CONFIG_KSU\n'
                  'extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n'
                  '#endif\n'
                  r'\1', s, count=1, flags=re.M)
              s = re.sub(
                  r'(long do_faccessat\([^}]*?\{)',
                  r'\1\n#ifdef CONFIG_KSU\n    ksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif',
                  s, count=1)
              open(p, 'w').write(s)

          # --- fs/read_write.c ---
          p = 'fs/read_write.c'
          s = open(p).read()
          if 'ksu_handle_vfs_read' not in s:
              s = re.sub(
                  r'(^ssize_t vfs_read\()',
                  '#ifdef CONFIG_KSU\n'
                  'extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n'
                  '#endif\n'
                  r'\1', s, count=1, flags=re.M)
              s = re.sub(
                  r'(ssize_t vfs_read\([^}]*?\{)',
                  r'\1\n#ifdef CONFIG_KSU\n    ksu_handle_vfs_read(&file, &buf, &count, &pos);\n#endif',
                  s, count=1)
              open(p, 'w').write(s)

          # --- fs/stat.c ---
          p = 'fs/stat.c'
          s = open(p).read()
          if 'ksu_handle_stat' not in s:
              s = re.sub(
                  r'(^int vfs_statx\()',
                  '#ifdef CONFIG_KSU\n'
                  'extern int ksu_handle_stat(int *dfd, const char __user **filename_user, void **statbuf, int *flags);\n'
                  '#endif\n'
                  r'\1', s, count=1, flags=re.M)
              s = re.sub(
                  r'(int vfs_statx\([^}]*?\{)',
                  r'\1\n#ifdef CONFIG_KSU\n    ksu_handle_stat(&dfd, &filename, &stat, &flags);\n#endif',
                  s, count=1)
              open(p, 'w').write(s)

          print("=== Patches applied ===")
          PYEOF
          echo "=== Verify patches ==="
          grep -l "ksu_handle" fs/exec.c fs/open.c fs/read_write.c fs/stat.c || true

      - name: Fix Clang compatibility issues
        working-directory: ./kernel
        run: |
          sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' Makefile
          find . -name "Makefile*" -exec sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} + 2>/dev/null || true
          sed -i 's/-flto=thin//g; s/-flto=full//g; s/-flto=auto//g' Makefile
          find . -name "Makefile*" -exec sed -i 's/-flto=thin//g' {} + 2>/dev/null || true
          sed -i 's/-Werror//g' Makefile scripts/Makefile.host 2>/dev/null || true
          echo 'HOSTCFLAGS += -Wno-error' >> Makefile
          sed -i 's/extern __read_mostly unsigned long zero_pfn;/extern unsigned long zero_pfn;/' include/asm-generic/pgtable.h
          echo 'KBUILD_CFLAGS += -std=gnu11' >> Makefile

      - name: Set environment (Ubuntu Clang)
        run: |
          {
            echo "CC=clang"
            echo "LD=ld.lld"
            echo "AR=llvm-ar"
            echo "NM=llvm-nm"
            echo "OBJCOPY=llvm-objcopy"
            echo "OBJDUMP=llvm-objdump"
            echo "STRIP=llvm-strip"
            echo "CROSS_COMPILE=aarch64-linux-gnu-"
            echo "ARCH=arm64"
            echo "HOSTLDFLAGS=-fuse-ld=lld"
          } >> $GITHUB_ENV

      - name: Configure & Build kernel
        working-directory: ./kernel
        run: |
          rm -rf out
          export PLATFORM_VERSION=11
          
          # Tắt các driver nặng không cần thiết để giảm tải RAM
          make O=out ${{ matrix.defconfig }}

          {
            echo "CONFIG_KSU=y"
            echo "# CONFIG_KPROBES is not set"
            echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set"
            echo "CONFIG_CC_STACKPROTECTOR_REGULAR=y"
            echo "# CONFIG_LTO is not set"
            echo "# CONFIG_LTO_CLANG is not set"
            echo "# CONFIG_LTO_CLANG_THIN is not set"
            echo "# CONFIG_THINLTO is not set"
            echo 'CONFIG_LOCALVERSION="-Haubai"'
            echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y"
            echo "CONFIG_IMG_GZ_DTB=y"
            echo "# CONFIG_IMG_DTB is not set"
          } >> out/.config

          make O=out olddefconfig

          echo "=== Verify config BEFORE build ==="
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_CC_STACKPROTECTOR|CONFIG_LTO|CONFIG_LOCALVERSION|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE|CONFIG_IMG_GZ_DTB" out/.config || true

          # Đổi -j$(nproc) thành -j2 để tránh OOM (GitHub runner chỉ có 7GB RAM)
          make -j2 O=out \
            ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- HOSTLDFLAGS="-fuse-ld=lld" \
            2>&1 | tee build.log

      - name: Show artifacts
        if: always()
        working-directory: ./kernel
        run: |
          [ -f out/include/config/kernel.release ] && echo "kernel.release: $(cat out/include/config/kernel.release)" || true
          ls -la out/arch/arm64/boot/ || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.defconfig }}
          path: kernel/build.log
          if-no-files-found: warn

      - name: Package zip
        if: success()
        run: |
          cp -r kernel/kernel_zip/anykernel ak && cd ak
          if [ -f ../kernel/out/arch/arm64/boot/Image.gz-dtb ]; then cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .
          elif [ -f ../kernel/out/arch/arm64/boot/Image.gz ]; then cp ../kernel/out/arch/arm64/boot/Image.gz .
          else cp ../kernel/out/arch/arm64/boot/Image .; fi
          zip -r9 ../HaubaiKernel_${{ matrix.defconfig }}.zip *

      - name: Upload zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HaubaiKernel_${{ matrix.defconfig }}
          path: HaubaiKernel_${{ matrix.defconfig }}.zip
          if-no-files-found: warn
