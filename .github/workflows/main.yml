name: Build Exynos7885 + KernelSU-Next v1.1.1 Manual Hook (GSI 11/13)
on:
  workflow_dispatch:
  push:
    branches: [ R24U ]

env:
  KERNEL_BRANCH: R24U
  KSU_NEXT_REF: next
  KSU_NEXT_TAG: "v1.1.1"
  LOCALVERSION: "-HaubaiEureka"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        defconfig:
          - exynos7885-a10_defconfig
          - exynos7885-a20_defconfig
          - exynos7885-a30_defconfig
          - exynos7885-a30s_defconfig
          - exynos7885-a40_defconfig

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 0
          submodules: recursive

      - name: Set Git user
        working-directory: ./kernel
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Setup KernelSU-Next v1.1.1
        working-directory: ./kernel
        run: |
          set -eux
          git submodule sync --recursive || true
          git submodule update --init --recursive --progress || true

          REF="${KSU_NEXT_TAG:-$KSU_NEXT_REF}"
          echo "Using KernelSU-Next ref: ${REF}"

          curl -fL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${REF}/kernel/setup.sh" \
            -o /tmp/ksu_setup.sh
          chmod +x /tmp/ksu_setup.sh
          bash /tmp/ksu_setup.sh "${REF}"

          echo "=== KernelSU-Next version ==="
          if [ -d KernelSU-Next ]; then
            ( cd KernelSU-Next && git describe --tags 2>/dev/null || git rev-parse --short HEAD )
          else
            echo "KernelSU-Next directory not present after setup"
            exit 1
          fi

      - name: Check KSU hook signatures
        working-directory: ./kernel
        run: |
          echo "=== KSU hook signatures ==="
          grep -rn "ksu_handle_execveat\|ksu_handle_faccessat\|ksu_handle_vfs_read\|ksu_handle_stat\|ksu_handle_sys_reboot" \
            KernelSU-Next/kernel/ 2>/dev/null | head -30 || echo "Hook signatures not found"

      - name: Clean previous build
        working-directory: ./kernel
        run: rm -rf out

      # ===== TÌM VÀ SỬA LOCALVERSION TẬN GỐC =====
      - name: Find hardcoded LOCALVERSION
        working-directory: ./kernel
        run: |
          echo "=== Makefile top-level ==="
          grep -n "LOCALVERSION\|Eureka\|R24U" Makefile 2>/dev/null | head -20 || true
          echo "=== Build scripts ==="
          grep -rn "LOCALVERSION\|Eureka\|R24U" build.config* *.sh scripts/ 2>/dev/null | head -30 || true
          echo "=== defconfig ==="
          grep -n "CONFIG_LOCALVERSION" arch/arm64/configs/*.config arch/arm64/configs/*defconfig 2>/dev/null | head -20 || true

      - name: Patch LOCALVERSION (Makefile + defconfig + scripts)
        working-directory: ./kernel
        run: |
          set -eux

          # --- A) Makefile top-level: xóa mọi dòng LOCALVERSION cũ, thêm mới sau EXTRAVERSION ---
          if grep -q "^LOCALVERSION[[:space:]]*=" Makefile; then
            echo "Found LOCALVERSION in Makefile, patching..."
            sed -i '/^LOCALVERSION[[:space:]]*=/d' Makefile
          fi
          if ! grep -q "^LOCALVERSION[[:space:]]*=" Makefile; then
            sed -i '/^EXTRAVERSION[[:space:]]*=/a LOCALVERSION = -HaubaiEureka' Makefile
          fi
          echo "--- Makefile after patch ---"
          grep -n "^LOCALVERSION\|^EXTRAVERSION\|^VERSION\|^PATCHLEVEL\|^SUBLEVEL" Makefile

          # --- B) defconfig: xóa CONFIG_LOCALVERSION cũ, thêm mới ---
          for f in arch/arm64/configs/exynos7885-*.config arch/arm64/configs/exynos7885-*defconfig; do
            [ -f "$f" ] || continue
            if grep -q "^CONFIG_LOCALVERSION" "$f"; then
              echo "Found CONFIG_LOCALVERSION in $f, replacing..."
              sed -i '/^CONFIG_LOCALVERSION=/d' "$f"
            fi
            echo 'CONFIG_LOCALVERSION="-HaubaiEureka"' >> "$f"
          done
          echo "--- defconfig after patch ---"
          grep -n "CONFIG_LOCALVERSION" arch/arm64/configs/exynos7885-* 2>/dev/null || true

          # --- C) Script build (nếu có) tự export LOCALVERSION ---
          grep -rln "LOCALVERSION" --include="*.sh" . 2>/dev/null | while read f; do
            echo "Patching script $f"
            sed -i 's/LOCALVERSION=-[^ "]*/LOCALVERSION=-HaubaiEureka/g' "$f" || true
          done

          # --- D) Loại bỏ mọi dấu vết Eureka/R24U còn sót trong Makefile ---
          sed -i 's/-Eureka_R24U/-HaubaiEureka/g; s/Eureka_R24U/HaubaiEureka/g' Makefile || true

          echo "=== Final LOCALVERSION check ==="
          grep -n "LOCALVERSION\|Eureka\|R24U" Makefile 2>/dev/null | head -10 || true

      - name: Patch kernel source for Manual Hook
        working-directory: ./kernel
        run: |
          set -eux

          EXEC_FILE="fs/exec.c"
          if ! grep -q "ksu_handle_execveat" "$EXEC_FILE"; then
            sed -i '/^int do_execve(struct filename \*filename,/i\
            #ifdef CONFIG_KSU_MANUAL_HOOK\
            extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\
                                void *argv, void *envp, int *flags);\
            #endif\
            ' "$EXEC_FILE"
            sed -i '/^int do_execve(struct filename \*filename,/,/^{/ {
              /^{/a\
            #ifdef CONFIG_KSU_MANUAL_HOOK\
            ksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\
            #endif
            }' "$EXEC_FILE"
          fi

          OPEN_FILE="fs/open.c"
          if ! grep -q "ksu_handle_faccessat" "$OPEN_FILE"; then
            sed -i '/^SYSCALL_DEFINE3(faccessat,/,/^{/ {
              /^{/a\
          #ifdef CONFIG_KSU_MANUAL_HOOK\
          ksu_handle_faccessat(&dfd, &filename, &mode, NULL);\
          #endif
            }' "$OPEN_FILE"
          fi

          READ_FILE="fs/read_write.c"
          if ! grep -q "ksu_handle_vfs_read" "$READ_FILE"; then
            sed -i '/^ssize_t vfs_read(struct file \*file, char __user \*buf, size_t count, loff_t \*pos)/,/^{/ {
              /^{/a\
          #ifdef CONFIG_KSU_MANUAL_HOOK\
          ksu_handle_vfs_read(&file, &buf, &count, &pos);\
          #endif
             }' "$READ_FILE"
          fi

          STAT_FILE="fs/stat.c"
          if ! grep -q "ksu_handle_stat" "$STAT_FILE"; then
            sed -i '/^SYSCALL_DEFINE4(newfstatat,/,/^{/ {
              /^{/a\
          #ifdef CONFIG_KSU_MANUAL_HOOK\
          ksu_handle_stat(&dfd, &filename, &statbuf, &flag);\
          #endif
            }' "$STAT_FILE"
          fi

          REBOOT_FILE="kernel/reboot.c"
          if ! grep -q "ksu_handle_sys_reboot" "$REBOOT_FILE"; then
            sed -i '/^SYSCALL_DEFINE4(reboot,/,/^{/ {
              /^{/a\
          #ifdef CONFIG_KSU_MANUAL_HOOK\
          ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\
          #endif
            }' "$REBOOT_FILE"
          fi

          echo "=== Verify patches ==="
          grep -l "ksu_handle" fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio gcc-aarch64-linux-gnu zip

      - name: Setup Neutron Clang
        run: |
          mkdir -p toolchain && cd toolchain
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=10032024
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          cd .. && echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: Set environment
        run: |
          {
            echo "CC=clang"
            echo "LD=ld.lld"
            echo "AR=llvm-ar"
            echo "NM=llvm-nm"
            echo "OBJCOPY=llvm-objcopy"
            echo "OBJDUMP=llvm-objdump"
            echo "STRIP=llvm-strip"
            echo "CROSS_COMPILE=aarch64-linux-gnu-"
            echo "ARCH=arm64"
          } >> $GITHUB_ENV

      - name: Configure kernel (Manual Hook + no LTO)
        working-directory: ./kernel
        run: |
          export PLATFORM_VERSION=11
          make O=out ARCH=arm64 ANDROID_MAJOR_VERSION=r ${{ matrix.defconfig }}

          cat >> out/.config <<'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_KPROBE_HOOKS is not set
          # CONFIG_KPROBES is not set
          CONFIG_LTO_NONE=y
          CONFIG_LOCALVERSION="-HaubaiEureka"
          EOF

          make O=out ARCH=arm64 ANDROID_MAJOR_VERSION=r olddefconfig

          echo "=== Verify KSU + LOCALVERSION config ==="
          grep -E "CONFIG_KSU|CONFIG_LTO|CONFIG_LOCALVERSION" out/.config || true

      - name: Verify LOCALVERSION before build
        working-directory: ./kernel
        run: |
          echo "=== LOCALVERSION in .config ==="
          grep "CONFIG_LOCALVERSION" out/.config || echo "(không có trong .config)"
          echo "=== LOCALVERSION in Makefile ==="
          grep -n "^LOCALVERSION\|^EXTRAVERSION" Makefile || true
          echo "=== Expected kernel.release components ==="
          grep -E "^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION|^LOCALVERSION" Makefile

      - name: Build kernel
        working-directory: ./kernel
        run: |
          export PLATFORM_VERSION=11
          set -o pipefail
          # KHÔNG truyền LOCALVERSION=... ở đây nữa, vì đã sửa tận gốc
          make -j$(nproc) O=out ARCH=arm64 ANDROID_MAJOR_VERSION=r \
            CC=${CC} LD=${LD} AR=${AR} NM=${NM} \
            OBJCOPY=${OBJCOPY} OBJDUMP=${OBJDUMP} STRIP=${STRIP} \
            CROSS_COMPILE=${CROSS_COMPILE} 2>&1 | tee build.log

      - name: Show kernel version & DTB artifacts
        if: always()
        working-directory: ./kernel
        run: |
          [ -f out/include/config/kernel.release ] && echo "kernel.release: $(cat out/include/config/kernel.release)" || true
          [ -f out/arch/arm64/boot/Image ] && strings out/arch/arm64/boot/Image 2>/dev/null | grep -m1 "4.4.302" || true
          echo "=== DTB artifacts ==="
          find out/arch/arm64/boot -maxdepth 3 \( -name "*.dtb" -o -name "*.dtbo" -o -name "dtb.img" -o -name "*.dtb.img" \) 2>/dev/null | sort || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.defconfig }}
          path: kernel/build.log
          if-no-files-found: warn

      - name: Package flashable zip
        if: success()
        run: |
          set -eux
          BOOTDIR=kernel/out/arch/arm64/boot
          cp -r kernel/kernel_zip/anykernel anykernel
          cd anykernel

          if   [ -f "../$BOOTDIR/Image.gz-dtb" ]; then
            cp "../$BOOTDIR/Image.gz-dtb" .
          elif [ -f "../$BOOTDIR/Image.gz" ]; then
            cp "../$BOOTDIR/Image.gz" .
          elif [ -f "../$BOOTDIR/Image" ]; then
            cp "../$BOOTDIR/Image" .
          else
            echo "::error::No kernel image found in $BOOTDIR"
            exit 1
          fi

          mkdir -p dtb dtbo
          [ -f "../$BOOTDIR/dtb.img" ]  && cp "../$BOOTDIR/dtb.img"  ./dtb/  || true
          [ -f "../$BOOTDIR/dtbo.img" ] && cp "../$BOOTDIR/dtbo.img" ./dtbo/ || true
          find "../$BOOTDIR" -maxdepth 4 -name "*.dtb"  -exec cp {} ./dtb/  \; 2>/dev/null || true
          find "../$BOOTDIR" -maxdepth 4 -name "*.dtbo" -exec cp {} ./dtbo/ \; 2>/dev/null || true
          if [ -z "$(ls -A dtb 2>/dev/null)" ]; then
            find ../kernel/out -name "*.dtb" -exec cp {} ./dtb/ \; 2>/dev/null || true
          fi
          if [ -z "$(ls -A dtbo 2>/dev/null)" ]; then
            find ../kernel/out -name "*.dtbo" -exec cp {} ./dtbo/ \; 2>/dev/null || true
          fi
          rmdir dtb 2>/dev/null || true
          rmdir dtbo 2>/dev/null || true

          echo "=== anykernel contents ==="
          find . -maxdepth 2 -type f | sort

          zip -r9 "../HaubaiKernel_${{ matrix.defconfig }}.zip" *
          cd ..

      - name: Upload zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HaubaiKernel_${{ matrix.defconfig }}
          path: HaubaiKernel_${{ matrix.defconfig }}.zip
          if-no-files-found: warn
