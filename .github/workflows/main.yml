name: Build Exynos7885 + KernelSU-Next + GSI Audio Fix
on:
  workflow_dispatch:
  push:
    branches: [ R24U ]

env:
  KERNEL_BRANCH: R24U
  KSU_NEXT_REF: next          # nhánh chính xác của KernelSU-Next
  KSU_NEXT_TAG: "3.4.2"            # có thể điền tag/commit để reproducible

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        defconfig:
          - exynos7885-a10_defconfig
          - exynos7885-a20_defconfig
          - exynos7885-a30_defconfig
          - exynos7885-a30s_defconfig
          - exynos7885-a40_defconfig

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.KERNEL_BRANCH }}
          path: kernel
          fetch-depth: 0
          submodules: recursive

      - name: Set Git user
        working-directory: ./kernel
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Setup KernelSU-Next
        working-directory: ./kernel
        run: |
          set -eux
          git submodule sync --recursive || true
          git submodule update --init --recursive --progress || true

          REF="${KSU_NEXT_REF}"
          if [ -n "${KSU_NEXT_TAG}" ]; then
            REF="${KSU_NEXT_TAG}"
          fi
          echo "Using KernelSU-Next ref: ${REF}"

          curl -fL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${REF}/kernel/setup.sh" \
            -o /tmp/ksu_setup.sh
          chmod +x /tmp/ksu_setup.sh
          bash /tmp/ksu_setup.sh "${REF}"

          echo "=== KernelSU-Next version ==="
          if [ -d KernelSU-Next ]; then
            ( cd KernelSU-Next && git describe --tags 2>/dev/null || git rev-parse --short HEAD )
          else
            echo "KernelSU-Next directory not present after setup"
            ls -la
            exit 1
          fi

      - name: Clean previous build
        working-directory: ./kernel
        run: rm -rf out

      - name: Patch DTS for GSI audio
        working-directory: ./kernel
        run: |
          set -x
          FOUND=0
          for f in $(grep -rl "codec,cod3035x" arch/arm64/boot/dts/exynos/ 2>/dev/null); do
            echo "=== Checking $f ==="
            if grep -q "eureka_kernel_variant" "$f"; then
              sed -i 's/eureka_kernel_variant = <[0-9]*>/eureka_kernel_variant = <3>/g' "$f"
              FOUND=1
            else
              sed -i '/compatible = "codec,cod3035x"/a\\t\teureka_kernel_variant = <3>;' "$f"
              FOUND=1
            fi
          done
          if [ "$FOUND" = "0" ]; then
            echo "::warning::No cod3035x DTS found, audio fix may not apply"
          fi
          echo "=== Verify DTS ==="
          grep -rn "eureka_kernel_variant" arch/arm64/boot/dts/exynos/ | head -20

      - name: Verify cod3035x driver supports eureka_kernel_variant
        working-directory: ./kernel
        run: |
          DRV=$(grep -rl "cod3035x" sound/soc/codecs/ 2>/dev/null | head -1 || true)
          if [ -z "$DRV" ]; then
            echo "::warning::cod3035x driver not found under sound/soc/codecs/"
            exit 0
          fi
          echo "Driver: $DRV"
          if ! grep -q "eureka_kernel_variant" "$DRV"; then
            echo "::warning::Driver $DRV does not parse eureka_kernel_variant — GSI audio fix may be a no-op"
          else
            echo "Driver reads eureka_kernel_variant — OK"
          fi

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio gcc-aarch64-linux-gnu zip

      - name: Setup Neutron Clang
        run: |
          mkdir -p toolchain
          cd toolchain
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=10032024
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          cd ..
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: Set environment
        run: |
          {
            echo "CC=clang"
            echo "LD=ld.lld"
            echo "AR=llvm-ar"
            echo "NM=llvm-nm"
            echo "OBJCOPY=llvm-objcopy"
            echo "OBJDUMP=llvm-objdump"
            echo "STRIP=llvm-strip"
            echo "CROSS_COMPILE=aarch64-linux-gnu-"
            echo "ARCH=arm64"
          } >> $GITHUB_ENV

      - name: Configure kernel
        working-directory: ./kernel
        run: |
          export PLATFORM_VERSION=11
          make O=out ARCH=arm64 ANDROID_MAJOR_VERSION=r ${{ matrix.defconfig }}

          # Ensure KernelSU is enabled
          if ! grep -q "^CONFIG_KSU=y" out/.config; then
            echo "CONFIG_KSU=y" >> out/.config
            echo "Enabled CONFIG_KSU in out/.config"
          fi

          # Re-run olddefconfig to resolve dependencies
          make O=out ARCH=arm64 ANDROID_MAJOR_VERSION=r olddefconfig
          grep -E "^CONFIG_KSU" out/.config || true

      - name: Build kernel
        working-directory: ./kernel
        run: |
          export PLATFORM_VERSION=11
          set -o pipefail
          make -j$(nproc) O=out ARCH=arm64 ANDROID_MAJOR_VERSION=r \
            CC=${CC} LD=${LD} AR=${AR} NM=${NM} \
            OBJCOPY=${OBJCOPY} OBJDUMP=${OBJDUMP} STRIP=${STRIP} \
            CROSS_COMPILE=${CROSS_COMPILE} 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.defconfig }}
          path: kernel/build.log
          if-no-files-found: warn

      - name: Package flashable zip
        if: success()
        run: |
          BOOTDIR=kernel/out/arch/arm64/boot
          echo "=== Boot artifacts ==="
          ls -la "$BOOTDIR" || true

          cp -r kernel/kernel_zip/anykernel anykernel
          cd anykernel

          if   [ -f "../$BOOTDIR/Image.gz-dtb" ]; then cp "../$BOOTDIR/Image.gz-dtb" .
          elif [ -f "../$BOOTDIR/Image.gz" ];     then cp "../$BOOTDIR/Image.gz" .
          elif [ -f "../$BOOTDIR/Image" ];        then cp "../$BOOTDIR/Image" .
          else
            echo "::error::No kernel image found in $BOOTDIR"
            exit 1
          fi

          # Sao chép dtb/dtbo nếu AnyKernel script cần
          if [ -f "../$BOOTDIR/dtb" ];      then cp "../$BOOTDIR/dtb" .; fi
          if [ -f "../$BOOTDIR/dtbo.img" ]; then cp "../$BOOTDIR/dtbo.img" .; fi

          zip -r9 "../HaubaiKernel_${{ matrix.defconfig }}.zip" *
          cd ..

      - name: Upload zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HaubaiKernel_${{ matrix.defconfig }}
          path: HaubaiKernel_${{ matrix.defconfig }}.zip
          if-no-files-found: warn
