name: Build Exynos7885 KSU-Next v1.1.1 (Clang 14)
on:
  workflow_dispatch:
  push:
    branches: [ R24U ]

env:
  KSU_TAG: "v1.1.1"
  LOCALVERSION: "-Haubai"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        defconfig:
          - exynos7885-a10_defconfig
          - exynos7885-a20_defconfig
          - exynos7885-a30_defconfig
          - exynos7885-a30s_defconfig
          - exynos7885-a40_defconfig

    steps:
      # =========================================================
      # 1. CHECKOUT & DEPENDENCIES
      # =========================================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: R24U
          path: kernel
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio \
            gcc-aarch64-linux-gnu zip libelf-dev pkg-config device-tree-compiler

      # =========================================================
      # 2. KERNELSU-NEXT + PATCH SOURCE
      # =========================================================
      - name: Setup KernelSU-Next v1.1.1 & Patch source
        working-directory: ./kernel
        run: |
          git submodule update --init --recursive
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_TAG}/kernel/setup.sh" | bash -s "${KSU_TAG}"

          # --- Patch LOCALVERSION ---
          sed -i '/^LOCALVERSION[[:space:]]*=/d' Makefile
          sed -i '/^EXTRAVERSION[[:space:]]*=/a LOCALVERSION = -Haubai' Makefile
          for f in arch/arm64/configs/exynos7885-*defconfig; do
            sed -i '/^CONFIG_LOCALVERSION=/d' "$f"
            echo 'CONFIG_LOCALVERSION="-Haubai"' >> "$f"
          done

          # --- Patch Manual Hook (kèm extern) ---
          # fs/exec.c
          sed -i '/^#include <linux\/sched.h>/a\
          #ifdef CONFIG_KSU\
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\
          #endif' fs/exec.c
          sed -i '/^static int do_execveat_common(int fd, struct filename \*filename,/,/^{/ { /^{/a\
          #ifdef CONFIG_KSU\
          ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\
          #endif
          }' fs/exec.c

          # fs/open.c
          sed -i '/^long do_faccessat/i\
          #ifdef CONFIG_KSU\
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\
          #endif' fs/open.c
          sed -i '/^long do_faccessat/,/^{/ { /^{/a\
          #ifdef CONFIG_KSU\
          ksu_handle_faccessat(&dfd, &filename, &mode, NULL);\
          #endif
          }' fs/open.c

          # fs/read_write.c
          sed -i '/^ssize_t vfs_read/i\
          #ifdef CONFIG_KSU\
          extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\
          #endif' fs/read_write.c
          sed -i '/^ssize_t vfs_read(struct file \*file, char __user \*buf, size_t count, loff_t \*pos)/,/^{/ { /^{/a\
          #ifdef CONFIG_KSU\
          ksu_handle_vfs_read(&file, &buf, &count, &pos);\
          #endif
          }' fs/read_write.c

          # fs/stat.c
          sed -i '/^int vfs_statx/i\
          #ifdef CONFIG_KSU\
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, void **statbuf, int *flags);\
          #endif' fs/stat.c
          sed -i '/^int vfs_statx/,/^{/ { /^{/a\
          #ifdef CONFIG_KSU\
          ksu_handle_stat(&dfd, &filename, &stat, &flags);\
          #endif
          }' fs/stat.c

          echo "=== Verify patches ==="
          grep -l "ksu_handle" fs/exec.c fs/open.c fs/read_write.c fs/stat.c

      # =========================================================
      # 2b. FIX CLANG COMPATIBILITY
      # =========================================================
      - name: Fix Clang compatibility issues
        working-directory: ./kernel
        run: |
          # Sửa cờ -implicit-function-declaration
          sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' Makefile
          find . -name "Makefile*" -exec sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} + 2>/dev/null || true

          # Sửa lỗi section attribute trên biến local
          sed -i 's/extern __read_mostly unsigned long zero_pfn;/extern unsigned long zero_pfn;/' include/asm-generic/pgtable.h

          # Xóa -Werror
          sed -i 's/-Werror//g' Makefile scripts/Makefile.host 2>/dev/null || true
          echo 'HOSTCFLAGS += -Wno-error' >> Makefile

          echo "=== Verify fixes ==="
          grep -n "zero_pfn" include/asm-generic/pgtable.h | head -3 || true

      # =========================================================
      # 3. TOOLCHAIN (AOSP Clang 14 - r450784e)
      # =========================================================
      - name: Setup AOSP Clang 14 (r450784e)
        run: |
          mkdir -p toolchain && cd toolchain
          curl -fL --retry 3 -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784e.tar.gz"
          tar -xzf clang.tar.gz && rm clang.tar.gz
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Set environment (Clang 14)
        run: |
          {
            echo "CC=clang"
            echo "LD=ld.lld"
            echo "AR=llvm-ar"
            echo "NM=llvm-nm"
            echo "OBJCOPY=llvm-objcopy"
            echo "OBJDUMP=llvm-objdump"
            echo "STRIP=llvm-strip"
            echo "CROSS_COMPILE=aarch64-linux-gnu-"
            echo "ARCH=arm64"
          } >> $GITHUB_ENV

      # =========================================================
      # 4. BUILD
      # =========================================================
      - name: Configure & Build kernel (Clang 14)
        working-directory: ./kernel
        run: |
           rm -rf out
           export PLATFORM_VERSION=11
           make O=out ${{ matrix.defconfig }}
           make O=out olddefconfig

           echo "=== Verify config AFTER olddefconfig ==="
           grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_CC_STACKPROTECTOR|CONFIG_LTO|CONFIG_LOCALVERSION|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE" out/.config || true

           make -j$(nproc) O=out \
           ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
           OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
           CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tee build.log

      # =========================================================
      # 5. PACKAGE & UPLOAD
      # =========================================================
      - name: Show artifacts
        if: always()
        working-directory: ./kernel
        run: |
          [ -f out/include/config/kernel.release ] && echo "kernel.release: $(cat out/include/config/kernel.release)" || true
          [ -f out/arch/arm64/boot/Image ] && strings out/arch/arm64/boot/Image 2>/dev/null | grep -m1 "Haubai" || true
          echo "=== Boot artifacts ==="
          ls -la out/arch/arm64/boot/ || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.defconfig }}
          path: kernel/build.log
          if-no-files-found: warn

      - name: Package flashable zip
        if: success()
        run: |
          cp -r kernel/kernel_zip/anykernel ak && cd ak
          if [ -f ../kernel/out/arch/arm64/boot/Image.gz ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz .
            echo "Using Image.gz"
          elif [ -f ../kernel/out/arch/arm64/boot/Image.gz ]; then
            cp ../kernel/out/arch/arm64/boot/Image.gz .
            echo "::warning::Image.gz not found, using Image.gz"
          else
            cp ../kernel/out/arch/arm64/boot/Image .
            echo "::warning::Image.gz not found, using Image"
          fi
          zip -r9 ../HaubaiKernel_${{ matrix.defconfig }}.zip *

      - name: Upload zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HaubaiKernel_${{ matrix.defconfig }}
          path: HaubaiKernel_${{ matrix.defconfig }}.zip
          if-no-files-found: warn
