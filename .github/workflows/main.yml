name: Build Exynos7885 KSU v0.9.5 (GCC Fixed)
on:
  workflow_dispatch:
  push:
    branches: [ R24U ]

env:
  KSU_TAG: "v0.9.5"
  LOCALVERSION: "-Haubai"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        defconfig:
          - exynos7885-a10_defconfig
          - exynos7885-a20_defconfig
          - exynos7885-a30_defconfig
          - exynos7885-a30s_defconfig
          - exynos7885-a40_defconfig

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: R24U
          path: kernel
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio \
            gcc-aarch64-linux-gnu zip libelf-dev pkg-config device-tree-compiler

      - name: Setup KernelSU & Patch source
        working-directory: ./kernel
        run: |
          git submodule update --init --recursive
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s "${KSU_TAG}"

          sed -i '/^LOCALVERSION[[:space:]]*=/d' Makefile
          sed -i '/^EXTRAVERSION[[:space:]]*=/a LOCALVERSION = -Haubai' Makefile
          for f in arch/arm64/configs/exynos7885-*defconfig; do
            sed -i '/^CONFIG_LOCALVERSION=/d' "$f"
            echo 'CONFIG_LOCALVERSION="-Haubai"' >> "$f"
          done

          # Manual Hook patches (giữ nguyên)
          sed -i '/^#include <linux\/sched.h>/a\
          #ifdef CONFIG_KSU\
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\
          #endif' fs/exec.c
          sed -i '/^static int do_execveat_common(int fd, struct filename \*filename,/,/^{/ { /^{/a\
          #ifdef CONFIG_KSU\
          ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\
          #endif
          }' fs/exec.c

          sed -i '/^long do_faccessat/i\
          #ifdef CONFIG_KSU\
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\
          #endif' fs/open.c
          sed -i '/^long do_faccessat/,/^{/ { /^{/a\
          #ifdef CONFIG_KSU\
          ksu_handle_faccessat(&dfd, &filename, &mode, NULL);\
          #endif
          }' fs/open.c

          sed -i '/^ssize_t vfs_read/i\
          #ifdef CONFIG_KSU\
          extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\
          #endif' fs/read_write.c
          sed -i '/^ssize_t vfs_read(struct file \*file, char __user \*buf, size_t count, loff_t \*pos)/,/^{/ { /^{/a\
          #ifdef CONFIG_KSU\
          ksu_handle_vfs_read(&file, &buf, &count, &pos);\
          #endif
          }' fs/read_write.c

          sed -i '/^int vfs_statx/i\
          #ifdef CONFIG_KSU\
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, void **statbuf, int *flags);\
          #endif' fs/stat.c
          sed -i '/^int vfs_statx/,/^{/ { /^{/a\
          #ifdef CONFIG_KSU\
          ksu_handle_stat(&dfd, &filename, &stat, &flags);\
          #endif
          }' fs/stat.c

      # =========================================================
      # FIX TẤT CẢ LỖI GCC
      # =========================================================
      - name: Fix all GCC 13/14 compatibility issues
        working-directory: ./kernel
        run: |
          # 1. Sửa cờ -implicit-function-declaration (GCC mới dùng -W...)
          sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' Makefile
          find . -name "Makefile*" -exec sed -i 's/-implicit-function-declaration/-Wimplicit-function-declaration/g' {} + 2>/dev/null || true

          # 2. Xóa cờ LTO của Clang (GCC không hiểu -flto=thin)
          sed -i 's/-flto=thin//g; s/-flto=full//g; s/-flto=auto//g' Makefile
          find . -name "Makefile*" -exec sed -i 's/-flto=thin//g' {} + 2>/dev/null || true

          # 3. Tắt -Werror để tránh GCC mới coi warning là lỗi
          sed -i 's/-Werror//g' Makefile scripts/Makefile.host 2>/dev/null || true
          echo 'HOSTCFLAGS += -Wno-error' >> Makefile

          # 4. Sửa lỗi "section attribute cannot be specified for local variables"
          #    (GCC 13+ không cho phép __read_mostly trên biến local)
          sed -i 's/extern __read_mostly unsigned long zero_pfn;/extern unsigned long zero_pfn;/' include/asm-generic/pgtable.h

          # 5. Ép chuẩn C11 (tránh GCC 13+ mặc định C23 làm bool/true/false thành keyword)
          #    Đây là nguyên nhân gây lỗi "bool redefined" hoặc "cannot use keyword 'false'"
          echo 'KBUILD_CFLAGS += -std=gnu11' >> Makefile

          echo "=== Verify fixes ==="
          grep -n "implicit-function" Makefile | head -3 || true
          grep -n "flto" Makefile | head -3 || true
          grep -n "zero_pfn" include/asm-generic/pgtable.h | head -3 || true
          grep -n "gnu11" Makefile | tail -3 || true

      - name: Set environment (GCC)
        run: |
          {
            echo "CC=aarch64-linux-gnu-gcc"
            echo "LD=aarch64-linux-gnu-ld"
            echo "AR=aarch64-linux-gnu-ar"
            echo "NM=aarch64-linux-gnu-nm"
            echo "OBJCOPY=aarch64-linux-gnu-objcopy"
            echo "OBJDUMP=aarch64-linux-gnu-objdump"
            echo "STRIP=aarch64-linux-gnu-strip"
            echo "CROSS_COMPILE=aarch64-linux-gnu-"
            echo "ARCH=arm64"
          } >> $GITHUB_ENV

      - name: Configure & Build kernel (GCC)
        working-directory: ./kernel
        run: |
          rm -rf out
          export PLATFORM_VERSION=11
          make O=out ${{ matrix.defconfig }}

          {
            echo "CONFIG_KSU=y"
            echo "# CONFIG_KPROBES is not set"
            echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set"
            echo "# CONFIG_LTO is not set"
            echo "# CONFIG_LTO_CLANG is not set"
            echo "# CONFIG_LTO_CLANG_THIN is not set"
            echo "# CONFIG_LTO_GCC is not set"
            echo "# CONFIG_THINLTO is not set"
            echo 'CONFIG_LOCALVERSION="-Haubai"'
            echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y"
          } >> out/.config

          make O=out olddefconfig

          echo "=== Verify config ==="
          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_CC_STACKPROTECTOR|CONFIG_LTO|CONFIG_LOCALVERSION|CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE" out/.config || true

          make -j$(nproc) O=out \
            ARCH=arm64 \
            CC=aarch64-linux-gnu-gcc \
            LD=aarch64-linux-gnu-ld \
            AR=aarch64-linux-gnu-ar \
            NM=aarch64-linux-gnu-nm \
            OBJCOPY=aarch64-linux-gnu-objcopy \
            OBJDUMP=aarch64-linux-gnu-objdump \
            STRIP=aarch64-linux-gnu-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            2>&1 | tee build.log

      - name: Show artifacts
        if: always()
        working-directory: ./kernel
        run: |
          [ -f out/include/config/kernel.release ] && echo "kernel.release: $(cat out/include/config/kernel.release)" || true
          ls -la out/arch/arm64/boot/ || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.defconfig }}
          path: kernel/build.log
          if-no-files-found: warn

      - name: Package zip
        if: success()
        run: |
          cp -r kernel/kernel_zip/anykernel ak && cd ak
          if [ -f ../kernel/out/arch/arm64/boot/Image.gz-dtb ]; then cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .
          elif [ -f ../kernel/out/arch/arm64/boot/Image.gz ]; then cp ../kernel/out/arch/arm64/boot/Image.gz .
          else cp ../kernel/out/arch/arm64/boot/Image .; fi
          zip -r9 ../HaubaiKernel_${{ matrix.defconfig }}.zip *

      - name: Upload zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HaubaiKernel_${{ matrix.defconfig }}
          path: HaubaiKernel_${{ matrix.defconfig }}.zip
          if-no-files-found: warn
